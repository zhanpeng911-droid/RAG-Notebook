  #     - ollama_data:/root/.ollama
  #   networks:
  #     - notebook-network
  #   # GPU支持（需要安装nvidia-container-toolkit）
  #   # deploy:
  #   #   resources:
  #   #     reservations:
  #   #       devices:
  #   #         - driver: nvidia
  #   #           count: 1
  #   #           capabilities: [gpu]

volumes:
  mysql_data:
  redis_data:
  backend_data:
  backend_logs:
  # ollama_data:

networks:
  notebook-network:
    driver: bridge
