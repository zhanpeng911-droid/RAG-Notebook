[project]
name = "backend"
version = "0.1.0"
description = "A FastAPI + LangChain project for LLM applications"
requires-python = ">=3.12"
authors = [
    { name = "RMA-MUN", email = "n3032747608@163.com" }
]
dependencies = [
    "python-dotenv~=1.2.2",
    "SQLAlchemy~=2.0.48",
    "alembic>=1.13.0",
    "langchain-core>=1.4.7,<2.0.0",
    "aiofiles~=25.1.0",
    "langchain-text-splitters~=1.1.1",
    "fastapi~=0.123.0",
    "starlette~=0.50.0",
    "pydantic-settings~=2.13.1",
    "langchain-community~=0.4.1",
    "python-jose~=3.5.0",
    "PyYAML~=6.0.3",
    "pydantic~=2.12.5",
    "requests~=2.32.5",
    "uvicorn==0.21.1",
    "aiomysql>=0.3.2",
    "redis>=4.5.2,<6.5",
    "langchain-ollama>=1.0.1",
    "langchain>=1.2.13",
    "langchain-chroma>=1.1.0",
    "python-multipart>=0.0.22",
    "dashscope>=1.25.14",
    "pypdf>=6.9.2",
    "python-docx>=1.2.0",
    "python-magic>=0.4.27",
    "python-magic-bin>=0.4.14; sys_platform == 'win32'",
    "langchain-dashscope>=0.1.8",
    "langchain-openai>=0.1.0",
    "langsmith>=0.7.22",
    "rank-bm25>=0.2.2",
    "pymupdf>=1.25.0",
    "pillow>=10.0.0",
    "imagehash>=4.3.0",
    "celery[redis]>=5.4.0",
    "jieba>=0.42.1",
]

[project.optional-dependencies]
# 本地 embedding / 重型文档解析（Docker full 镜像或本地可选安装）
local-embed = [
    "sentence-transformers>=5.3.0",
    "modelscope>=1.35.3",
    "accelerate>=1.13.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "torchaudio>=2.11.0",
]
docs-heavy = [
    "unstructured[all-docs]>=0.22.20",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=5.0",
    "aiosqlite>=0.20.0",
    "black>=24.0.0",
    "isort>=5.12.0",
    "ruff>=0.3.0",
    "mypy>=1.10",
]

[tool.mypy]
python_version = "3.12"
# 首批只覆盖 app/core、app/schemas、app/utils、app/config（见 CI mypy job），
# 其余目录类型标注尚不完整，逐步纳入。
ignore_missing_imports = true
check_untyped_defs = true
full = [
    "backend[local-embed,docs-heavy]",
]

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[tool.ruff]
line-length = 100
target-version = "py312"
# 初期只用默认规则集（E4/E7/E9/F），不一次开全量规则。
# E402：celery/测试文件存在"先读环境变量/sys.path 再导入"的刻意模式，按行 noqa 标注。

[tool.isort]
profile = "black"

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
