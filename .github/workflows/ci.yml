name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps (dev)
        run: |
          uv sync --locked --extra dev
      - name: Ruff
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run ruff check app tests
          else
            python -m ruff check app tests
          fi
      - name: Pytest
        env:
          SECRET_KEY: ci-test-secret
          MYSQL_HOST: localhost
          REDIS_HOST: localhost
          LLM_TYPE: OLLAMA
          RATE_LIMIT_ENABLED: "false"
          FEATURE_ORG: "false"
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run pytest tests -q --tb=line --cov=app --cov-report=term-missing --cov-fail-under=85
          else
            python -m pytest tests -q --tb=line --cov=app --cov-report=term-missing --cov-fail-under=85
          fi

  django:
    name: Django user/file tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DjangoUserService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        run: |
          uv sync --locked --extra dev
      - name: Ruff lint
        run: |
          uv run ruff check .
      - name: Tests
        env:
          JWT_SECRET_KEY: ci-test-secret
          DEBUG: "true"
          DJANGO_SETTINGS_MODULE: DjangoUserService.test_settings
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run python manage.py test apps.user apps.file --settings=DjangoUserService.test_settings -v1
          else
            python manage.py test apps.user apps.file --settings=DjangoUserService.test_settings -v1
          fi

  mypy:
    name: Backend type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps (dev)
        run: |
          uv sync --locked --extra dev
      - name: Mypy (core modules first)
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run mypy app/core app/schemas app/utils app/config
          else
            python -m mypy app/core app/schemas app/utils app/config
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests + coverage
        run: npm run test:unit:coverage
      - run: npm run build

  frontend-e2e:
    name: Frontend E2E (mocked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: front/test-results/
          retention-days: 7

  security-backend:
    name: Security audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Backend audit (pip-audit, high/critical blocks)
        working-directory: backend
        # 门禁化：high/critical 阻断；medium 仅报告。
        # 豁免登记（理由见 QUALITY_ASSURANCE_PLAN_R3.md 遗留登记）：
        # - starlette：fastapi~=0.123 锁 starlette<0.51，修复需 1.x → 连带 fastapi 大版本
        # - aiohttp/chromadb/cryptography/ecdsa/langchain：传递依赖，升级被上游锁定或无修复版本
        run: |
          uv sync --locked --extra dev
          uv run pip-audit --fail-level=high \
            --ignore-vuln PYSEC-2026-161 PYSEC-2026-248 PYSEC-2026-249 PYSEC-2026-2280 PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-3545 PYSEC-2026-3546 PYSEC-2026-3547 \
            --ignore-vuln PYSEC-2026-311 CVE-2026-45830 CVE-2026-45831 CVE-2026-45833 \
            --ignore-vuln PYSEC-2026-3552 PYSEC-2026-1325 PYSEC-2026-2192

  security-frontend:
    name: Security audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Frontend audit (npm audit, critical blocks)
        working-directory: front
        run: npm audit --audit-level=critical

  compose:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
