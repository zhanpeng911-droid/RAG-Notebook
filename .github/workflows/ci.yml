name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps (dev)
        run: |
          uv sync --locked --extra dev
      - name: Ruff
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run ruff check app tests
          else
            python -m ruff check app tests
          fi
      - name: Pytest
        env:
          SECRET_KEY: ci-test-secret
          MYSQL_HOST: localhost
          REDIS_HOST: localhost
          LLM_TYPE: OLLAMA
          RATE_LIMIT_ENABLED: "false"
          FEATURE_ORG: "false"
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run pytest tests -q --tb=line --cov=app --cov-report=term-missing --cov-fail-under=85 --ignore=tests/functional
          else
            python -m pytest tests -q --tb=line --cov=app --cov-report=term-missing --cov-fail-under=85 --ignore=tests/functional
          fi

  django:
    name: Django user/file tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DjangoUserService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        run: |
          uv sync --locked --extra dev
      - name: Ruff lint
        run: |
          uv run ruff check .
      - name: Tests
        env:
          JWT_SECRET_KEY: ci-test-secret
          DEBUG: "true"
          DJANGO_SETTINGS_MODULE: DjangoUserService.test_settings
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run python manage.py test apps.user apps.file --settings=DjangoUserService.test_settings -v1
          else
            python manage.py test apps.user apps.file --settings=DjangoUserService.test_settings -v1
          fi

  mypy:
    name: Backend type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps (dev)
        run: |
          uv sync --locked --extra dev
      - name: Mypy (core modules first)
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run mypy app/core app/schemas app/utils app/config
          else
            python -m mypy app/core app/schemas app/utils app/config
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests + coverage
        run: npm run test:unit:coverage
      - run: npm run build

  frontend-e2e:
    name: Frontend E2E (mocked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: front/test-results/
          retention-days: 7

  security-backend:
    name: Security audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Backend audit (pip-audit, native policy)
        working-directory: backend
        # 工具原生策略：扫描到未获批准的漏洞即失败（exit 1）；网络失败不视为零漏洞。
        # pip-audit 2.10.1 无 --fail-level；豁免必须逐条 --ignore-vuln。
        # 豁免登记（理由见 QUALITY_ASSURANCE_PLAN_R3.md 遗留登记）：
        # - PYSEC-2026-161/248/249/2280/2281/311/1325：见 R3 遗留登记
        # - CVE-2026-45830/31/33：chromadb/ecdsa 无修复版本
        # 已升级修复：aiohttp 3.14.3、cryptography 50.0.1、langchain 1.3.18、pyasn1/pypdf/requests/pydantic-settings
        run: |
          uv sync --locked --extra dev
          uv run pip-audit -o pip-audit-backend.json \
            --ignore-vuln PYSEC-2026-161 \
            --ignore-vuln PYSEC-2026-248 \
            --ignore-vuln PYSEC-2026-249 \
            --ignore-vuln PYSEC-2026-2280 \
            --ignore-vuln PYSEC-2026-2281 \
            --ignore-vuln PYSEC-2026-311 \
            --ignore-vuln CVE-2026-45830 \
            --ignore-vuln CVE-2026-45831 \
            --ignore-vuln CVE-2026-45833 \
            --ignore-vuln PYSEC-2026-1325
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-backend
          path: backend/pip-audit-backend.json
          retention-days: 14

  security-django:
    name: Security audit (Django)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Django audit (pip-audit, native policy)
        working-directory: DjangoUserService
        # Django 独立依赖环境单独审计；2026-09-04 升级到无已知漏洞基线。
        run: |
          uv sync --locked --extra dev
          uv run pip-audit -o pip-audit-django.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-django
          path: DjangoUserService/pip-audit-django.json
          retention-days: 14

  security-frontend:
    name: Security audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Frontend audit (npm audit, critical blocks)
        working-directory: front
        run: npm audit --audit-level=critical

  compose:
    name: Docker compose config
    runs-on: ubuntu-latest
    env:
      # .env.docker 模板含 ${JWT_SECRET_KEY:?} 必填插值；注入非生产测试值以便干净环境解析
      JWT_SECRET_KEY: ci-test-secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
