name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps (dev)
        run: |
          uv sync --locked --extra dev
      - name: Ruff
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run ruff check app tests
          else
            python -m ruff check app tests
          fi
      - name: Pytest
        env:
          SECRET_KEY: ci-test-secret
          MYSQL_HOST: localhost
          REDIS_HOST: localhost
          LLM_TYPE: OLLAMA
          RATE_LIMIT_ENABLED: "false"
          FEATURE_ORG: "false"
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run pytest tests -q --tb=line --cov=app --cov-report=term-missing
          else
            python -m pytest tests -q --tb=line --cov=app --cov-report=term-missing
          fi

  django:
    name: Django user/file tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: DjangoUserService
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps
        run: |
          uv sync --locked
      - name: Tests
        env:
          JWT_SECRET_KEY: ci-test-secret
          DEBUG: "true"
          DJANGO_SETTINGS_MODULE: DjangoUserService.test_settings
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run python manage.py test apps.user apps.file --settings=DjangoUserService.test_settings -v1
          else
            python manage.py test apps.user apps.file --settings=DjangoUserService.test_settings -v1
          fi

  mypy:
    name: Backend type check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: pip install uv
      - name: Sync deps (dev)
        run: |
          uv sync --locked --extra dev
      - name: Mypy (core modules first)
        run: |
          if command -v uv >/dev/null 2>&1; then
            uv run mypy app/core app/schemas app/utils app/config
          else
            python -m mypy app/core app/schemas app/utils app/config
          fi

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test:unit
      - run: npm run build

  frontend-e2e:
    name: Frontend E2E (mocked)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: front/test-results/
          retention-days: 7

  security:
    name: Dependency audit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: front/package-lock.json
      - name: Install uv
        run: pip install uv
      - name: Backend audit (pip-audit)
        working-directory: backend
        run: |
          uv sync --locked --extra dev
          uv run pip-audit
      - name: Frontend audit (npm audit)
        working-directory: front
        run: npm audit --audit-level=critical

  compose:
    name: Docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose -f docker-compose.yml config --quiet
