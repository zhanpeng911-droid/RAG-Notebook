server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（server 级；location 内不新增 add_header，避免继承被覆盖）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com https://at.alicdn.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;


    # gzip压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 静态资源缓存
    # 只用 expires 设置 Cache-Control；不加局部 add_header（否则会整体覆盖 server 级安全头）。
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
    }

    # 知识库批量上传：210MiB 请求上限（为应用 200MiB 总量留 multipart 余量；
    # 应用仍执行单文件 20MiB、总量 200MiB 与文件数量限制）。头像上传另有 2MiB 上限。
    location ^~ /api/v1/knowledge/add/multiple/v2 {
        client_max_body_size 210m;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    # API代理 - 后端服务（^~ 前缀优先于静态正则，避免 .png 等私有图片被静态 location 截获）
    # 前端所有 FastAPI 请求均使用 /api/v1 前缀；proxy_pass 无 URI 形式，前缀不被剥离。
    location ^~ /api/v1/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 90s;
    }

    # 头像上传：2MiB 请求上限（应用仍限制图片 1MiB）
    location ^~ /file/upload/ {
        client_max_body_size 2m;
        proxy_pass http://django:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # 用户相关接口代理到 Django 服务
    location ^~ /user {
        proxy_pass http://django:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /file {
        proxy_pass http://django:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 头像静态服务（django_media 卷，只读挂载；仅承载头像等公开媒体，不映射知识库私有文件）
    location ^~ /media/ {
        alias /srv/notebook-media/;
        autoindex off;
    }

    # SPA路由支持（/chat/:sessionId 等刷新路由走这里，不是 API 转发）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
